<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
text-align:center;
}
h1{
margin-top:40px;
font-size:40px;
color:#ff4d6d;
}
img{
width:250px;
border-radius:20px;
margin-top:20px;
}
p{
font-size:22px;
padding:20px;
}
  img{
  animation: float 3s ease-in-out infinite;
  box-shadow: 0 0 20px #ff69b4, 0 0 40px #ff69b4;
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
  100%{transform:translateY(0);}
}
  #door{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#111;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#door h2{
  color:#fff;
  font-size:28px;
  margin-bottom:20px;
}

#door button{
  padding:15px 30px;
  font-size:22px;
  border:none;
  border-radius:10px;
  background:#ff4d6d;
  color:white;
  cursor:pointer;
}.blood{
position:fixed;
top:-50px;
color:red;
font-size:35px;
animation:fall 5s linear infinite;
pointer-events:none;
}

@keyframes fall{
0%{
transform:translateY(-50px);
opacity:1;
}
100%{
transform:translateY(110vh);
opacity:0;
}
}
</style>
</head>
<body>
<div id="door">
  <h2>🎁 Tap to Open Your Surprise 🎁</h2>
  <button onclick="openDoor()">🚪 Open</button>
</div>

<div id="mainContent" style="display:none;">
<h1>🎂 Happy Birthday 🎂</h1>

<img src="Snapchat-1175802898.jpg">
<img src="Snapchat-1630502644.jpg">
<img src="Snapchat-1884032535.jpg">
<img src="Snapchat-1993174144.jpg">
<img src="Snapchat-232604866.jpg">
<img src="Snapchat-269671352.jpg">

<p>
Wishing you lots of happiness, success and love ❤️<br>
Have an amazing birthday! 🎉
</p>

<audio controls autoplay loop>
<source src="song.mp3" type="audio/mpeg">
</audio>
</div>

<script>
function openDoor(){
  document.getElementById("door").style.display="none";
  document.getElementById("mainContent").style.display="block";

  var music=document.querySelector("audio");
  if(music){
    music.play();
  }
}for(let i=0;i<30;i++){
  let b=document.createElement("div");
  b.className="blood";
  b.innerHTML="🩸";
  b.style.left=Math.random()*100+"vw";
  b.style.animationDelay=Math.random()*5+"s";
  document.body.appendChild(b);
}
</script>
</body>
</html>
